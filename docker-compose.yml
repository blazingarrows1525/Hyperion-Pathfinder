services:
  hyperion-pathfinder:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyperion-pathfinder:latest
    container_name: hyperion-pathfinder
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
